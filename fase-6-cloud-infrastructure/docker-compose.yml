# ==============================================================================
# FASE 6 — PARTE 3: OBSERVABILIDAD INDUSTRIAL CON PROMETHEUS Y GRAFANA
# Stack de Producción: Enterprise RAG + LLM Gateway + Prometheus + Grafana
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Servicio 1: Enterprise Hybrid RAG Engine (Axum + Candle + SIMD)
  # ----------------------------------------------------------------------------
  rag-engine:
    build:
      context: ../fase-5-proyecto-final
      dockerfile: ../fase-6-cloud-infrastructure/docker/Dockerfile.chef
    image: ai-stack/rag-engine:latest
    container_name: ai-rag-engine
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - RAG_PORT=3000
    networks:
      - ai-mesh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ----------------------------------------------------------------------------
  # Servicio 2: High-Throughput LLM Gateway (vLLM en Rust + Paged KV-Cache + SSE)
  # ----------------------------------------------------------------------------
  llm-gateway:
    build:
      context: ../fase-5-proyecto-final
      dockerfile: ../fase-6-cloud-infrastructure/docker/Dockerfile.gateway
    image: ai-stack/llm-gateway:latest
    container_name: ai-llm-gateway
    ports:
      - "8081:8081"
    environment:
      - RUST_LOG=info
      - PORT=8081
      - RAG_SERVICE_URL=http://rag-engine:3000
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-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}
      - NVIDIA_MODEL=nvidia/nemotron-3.5-bolt-e4b
    networks:
      - ai-mesh-network
    depends_on:
      rag-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Servicio 3: Prometheus (Recolección y Agregación de Métricas /metrics)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - ai-mesh-network
    restart: unless-stopped
    depends_on:
      - rag-engine
      - llm-gateway
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ----------------------------------------------------------------------------
  # Servicio 4: Grafana (Dashboards en Tiempo Real para el Stack de IA)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: ai-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - ai-mesh-network
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

# ------------------------------------------------------------------------------
# Red Aislada de Comunicación Interna (Service Discovery por DNS)
# ------------------------------------------------------------------------------
networks:
  ai-mesh-network:
    driver: bridge
